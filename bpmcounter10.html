<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BPMカウンター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #E6EEF0;
    --surface: #FFFFFF;
    --text: #0C2630;
    --muted: #4D6B74;
    --line: #BCCFD4;
    --accent: #B45F06;
    --on-accent: #FFFFFF;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0C2630;
      --surface: #123642;
      --text: #E8F1F2;
      --muted: #8FADB5;
      --line: #25505E;
      --accent: #FFB84D;
      --on-accent: #0C2630;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0C2630;
    --surface: #123642;
    --text: #E8F1F2;
    --muted: #8FADB5;
    --line: #25505E;
    --accent: #FFB84D;
    --on-accent: #0C2630;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    display: flex;
    flex-direction: column;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }

  .stage {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.25rem;
    padding: 1rem;
  }
  #count {
    font-family: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
    font-weight: 600;
    font-size: clamp(7rem, min(52vw, 46vh), 30rem);
    line-height: 0.9;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    user-select: none;
    will-change: transform;
  }
  body[data-state="idle"] #count,
  body[data-state="stopped"] #count { color: var(--muted); }

  .dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.7rem; min-height: 1rem; }
  .dot {
    width: 1rem; height: 1rem; border-radius: 50%;
    border: 2px solid var(--muted);
  }
  .dot.on { background: var(--accent); border-color: var(--accent); }

  .panel {
    width: 100%;
    max-width: 42rem;
    margin: 0 auto;
    background: var(--surface);
    border: 1px solid var(--line);
    border-bottom: 0;
    border-radius: 1.25rem 1.25rem 0 0;
    padding: 1.1rem 1.1rem 1.25rem;
    display: grid;
    gap: 1rem;
  }

  .bpm-row { display: grid; grid-template-columns: 3.75rem 1fr 3.75rem; gap: 0.75rem; align-items: center; }
  .step {
    height: 3.75rem; border-radius: 0.9rem;
    border: 1px solid var(--line); background: transparent; color: var(--text);
    font: inherit; font-size: 1.8rem; font-weight: 700; cursor: pointer;
    touch-action: manipulation;
  }
  .step:active { background: var(--bg); }
  .bpm-field { display: grid; justify-items: center; gap: 0.1rem; }
  .bpm-field span { font-size: 0.85rem; color: var(--muted); font-weight: 500; }
  #bpm {
    width: 100%; max-width: 12rem;
    border: 0; border-bottom: 2px solid var(--line); border-radius: 0;
    background: transparent; color: var(--text);
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 600;
    font-size: 3rem; line-height: 1.1; text-align: center;
    -moz-appearance: textfield; appearance: textfield;
  }
  #bpm::-webkit-outer-spin-button, #bpm::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  input[type="range"] { width: 100%; accent-color: var(--accent); height: 2rem; margin: 0; }

  .opts { display: flex; flex-wrap: wrap; gap: 0.75rem 1rem; align-items: center; }
  .opts label { display: inline-flex; align-items: center; gap: 0.5rem; font-size: 0.95rem; font-weight: 500; }
  select {
    font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 0.6rem;
    padding: 0.5rem 0.6rem; min-height: 2.75rem;
  }
  input[type="checkbox"] { width: 1.3rem; height: 1.3rem; accent-color: var(--accent); }
  #tap {
    margin-left: auto;
    min-height: 2.75rem; padding: 0 1rem;
    border: 1px solid var(--line); border-radius: 0.6rem;
    background: transparent; color: var(--text);
    font: inherit; font-weight: 700; cursor: pointer; touch-action: manipulation;
  }
  #tap:active { background: var(--bg); }

  .go {
    min-height: 4.25rem; border: 0; border-radius: 1rem;
    background: var(--accent); color: var(--on-accent);
    font: inherit; font-size: 1.5rem; font-weight: 700; cursor: pointer;
    touch-action: manipulation;
  }
  body[data-state="running"] .go { background: transparent; color: var(--text); border: 2px solid var(--text); }

  button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 3px solid var(--accent); outline-offset: 2px;
  }

  @media (max-height: 560px) {
    #count { font-size: clamp(4rem, 36vh, 14rem); }
    .panel { gap: 0.6rem; padding-top: 0.7rem; }
  }
</style>
</head>
<body data-state="idle">
  <main class="stage" aria-label="カウント表示">
    <div id="count">–</div>
    <div class="dots" id="dots" aria-hidden="true"></div>
  </main>

  <section class="panel" aria-label="設定">
    <div class="bpm-row">
      <button class="step" id="minus" type="button" aria-label="BPMを1下げる">−</button>
      <label class="bpm-field">
        <span>BPM(1分あたりの拍数)</span>
        <input id="bpm" type="number" inputmode="numeric" min="20" max="300" step="1">
      </label>
      <button class="step" id="plus" type="button" aria-label="BPMを1上げる">＋</button>
    </div>
    <input id="slider" type="range" min="20" max="300" step="1" aria-label="BPMスライダー">

    <div class="opts">
      <label>ループ
        <select id="loop">
          <option value="0">なし</option>
          <option value="2">2拍</option>
          <option value="3">3拍</option>
          <option value="4">4拍</option>
          <option value="5">5拍</option>
          <option value="6">6拍</option>
          <option value="7">7拍</option>
          <option value="8">8拍</option>
          <option value="12">12拍</option>
          <option value="16">16拍</option>
        </select>
      </label>
      <label><input type="checkbox" id="sound">クリック音</label>
      <button id="tap" type="button">タップでテンポ設定</button>
    </div>

    <button id="toggle" class="go" type="button">スタート</button>
  </section>

<script>
(function () {
  var MIN_BPM = 20, MAX_BPM = 300;
  var STORE_KEY = "bpm-counter:v1";

  var el = {
    count: document.getElementById("count"),
    dots: document.getElementById("dots"),
    bpm: document.getElementById("bpm"),
    slider: document.getElementById("slider"),
    minus: document.getElementById("minus"),
    plus: document.getElementById("plus"),
    loop: document.getElementById("loop"),
    sound: document.getElementById("sound"),
    tap: document.getElementById("tap"),
    toggle: document.getElementById("toggle")
  };

  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var bpm = 120, loopLen = 0, count = 0;
  var running = false, lastBeat = 0, timer = null;

  /* ---------- 保存・復元 ---------- */
  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return;
      var s = JSON.parse(raw);
      if (typeof s.bpm === "number") bpm = clamp(Math.round(s.bpm));
      if (typeof s.loop === "number") loopLen = s.loop;
      if (typeof s.sound === "boolean") el.sound.checked = s.sound;
    } catch (e) {}
  }
  function save() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({ bpm: bpm, loop: loopLen, sound: el.sound.checked }));
    } catch (e) {}
  }

  function clamp(v) { return Math.min(MAX_BPM, Math.max(MIN_BPM, v)); }
  function interval() { return 60000 / bpm; }

  /* ---------- 表示 ---------- */
  function renderDots() {
    el.dots.innerHTML = "";
    for (var i = 0; i < loopLen; i++) {
      var d = document.createElement("span");
      d.className = "dot";
      el.dots.appendChild(d);
    }
  }
  function show(n) {
    el.count.textContent = String(n);
    var dots = el.dots.children;
    for (var i = 0; i < dots.length; i++) {
      dots[i].classList.toggle("on", i === n);
    }
    if (!reduceMotion && el.count.animate) {
      el.count.animate(
        [{ transform: "scale(1.05)" }, { transform: "scale(1)" }],
        { duration: Math.min(180, interval() * 0.6), easing: "ease-out" }
      );
    }
    beep(n === 0);
  }
  function setState(s) { document.body.setAttribute("data-state", s); }

  /* ---------- テンポ変更 ---------- */
  function setBpm(v) {
    bpm = clamp(Math.round(v));
    el.bpm.value = bpm;
    el.slider.value = bpm;
    if (running) schedule();
    save();
  }

  /* ---------- カウント ---------- */
  function schedule() {
    clearTimeout(timer);
    var delay = Math.max(0, lastBeat + interval() - performance.now());
    timer = setTimeout(tick, delay);
  }
  function tick() {
    if (!running) return;
    var now = performance.now();
    lastBeat += interval();
    // タブが長時間止まった場合などは基準を今に合わせ直す
    if (now - lastBeat > interval() * 2) lastBeat = now;
    count += 1;
    if (loopLen > 0 && count >= loopLen) count = 0;
    show(count);
    schedule();
  }
  function start() {
    ensureAudio();
    running = true;
    count = 0;
    lastBeat = performance.now();
    setState("running");
    el.toggle.textContent = "ストップ";
    lockScreen();
    show(count);
    schedule();
  }
  function stop() {
    running = false;
    clearTimeout(timer);
    setState("stopped");
    el.toggle.textContent = "スタート";
    unlockScreen();
  }
  function toggle() { running ? stop() : start(); }

  /* ---------- クリック音 ---------- */
  var ctx = null;
  function ensureAudio() {
    try {
      if (!ctx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (AC) ctx = new AC();
      }
      if (ctx && ctx.state === "suspended") ctx.resume();
    } catch (e) {}
  }
  function beep(accent) {
    if (!el.sound.checked || !ctx) return;
    try {
      var t = ctx.currentTime;
      var o = ctx.createOscillator();
      var g = ctx.createGain();
      o.type = "sine";
      o.frequency.value = accent ? 1500 : 1000;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.4, t + 0.002);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
      o.connect(g);
      g.connect(ctx.destination);
      o.start(t);
      o.stop(t + 0.07);
    } catch (e) {}
  }

  /* ---------- 画面スリープ防止 ---------- */
  var wake = null;
  function lockScreen() {
    try {
      if ("wakeLock" in navigator) {
        navigator.wakeLock.request("screen").then(function (w) { wake = w; }, function () {});
      }
    } catch (e) {}
  }
  function unlockScreen() {
    try { if (wake) { wake.release(); wake = null; } } catch (e) {}
  }
  document.addEventListener("visibilitychange", function () {
    if (running && document.visibilityState === "visible") lockScreen();
  });

  /* ---------- タップテンポ ---------- */
  var taps = [];
  el.tap.addEventListener("click", function () {
    var now = performance.now();
    if (taps.length && now - taps[taps.length - 1] > 2000) taps = [];
    taps.push(now);
    if (taps.length > 6) taps.shift();
    if (taps.length >= 2) {
      var sum = 0;
      for (var i = 1; i < taps.length; i++) sum += taps[i] - taps[i - 1];
      var avg = sum / (taps.length - 1);
      setBpm(60000 / avg);
    }
  });

  /* ---------- ＋/− ボタン(長押しで連続変更) ---------- */
  function holdRepeat(btn, delta) {
    var delayTimer = null, repeatTimer = null, pressed = false;
    function stopHold() {
      clearTimeout(delayTimer);
      clearInterval(repeatTimer);
      pressed = false;
    }
    btn.addEventListener("pointerdown", function (e) {
      pressed = true;
      setBpm(bpm + delta);
      delayTimer = setTimeout(function () {
        repeatTimer = setInterval(function () { setBpm(bpm + delta); }, 70);
      }, 400);
    });
    ["pointerup", "pointerleave", "pointercancel"].forEach(function (ev) {
      btn.addEventListener(ev, stopHold);
    });
    // キーボード操作(Enter/Space)用
    btn.addEventListener("click", function (e) {
      if (e.detail === 0) setBpm(bpm + delta);
    });
  }
  holdRepeat(el.minus, -1);
  holdRepeat(el.plus, 1);

  /* ---------- 入力イベント ---------- */
  el.slider.addEventListener("input", function () { setBpm(Number(el.slider.value)); });
  el.bpm.addEventListener("change", function () {
    var v = Number(el.bpm.value);
    setBpm(isFinite(v) && v > 0 ? v : bpm);
  });
  el.bpm.addEventListener("keydown", function (e) {
    if (e.key === "Enter") el.bpm.blur();
  });
  el.loop.addEventListener("change", function () {
    loopLen = Number(el.loop.value);
    renderDots();
    if (running) {
      if (loopLen > 0 && count >= loopLen) count = 0;
      var dots = el.dots.children;
      for (var i = 0; i < dots.length; i++) dots[i].classList.toggle("on", i === count);
    }
    save();
  });
  el.sound.addEventListener("change", function () {
    if (el.sound.checked) ensureAudio();
    save();
  });
  el.toggle.addEventListener("click", toggle);

  document.addEventListener("keydown", function (e) {
    var tag = (e.target && e.target.tagName) || "";
    if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
    if (e.code === "Space" && tag !== "BUTTON") {
      e.preventDefault();
      toggle();
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      setBpm(bpm + (e.shiftKey ? 10 : 1));
    } else if (e.key === "ArrowDown") {
      e.preventDefault();
      setBpm(bpm - (e.shiftKey ? 10 : 1));
    }
  });

  /* ---------- 初期化 ---------- */
  load();
  el.loop.value = String(loopLen);
  if (el.loop.value !== String(loopLen)) { loopLen = 0; el.loop.value = "0"; }
  renderDots();
  setBpm(bpm);
})();
</script>
</body>
</html>
